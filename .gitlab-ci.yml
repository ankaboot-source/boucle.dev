# boucle engine shim (generated by bin/setup — safe to re-run).
# Includes the boucle engine pipeline from the .boucle/ submodule.
# Add your own jobs below this block; they run after the engine stages.
include:
  - remote: 'https://raw.githubusercontent.com/ankaboot-source/boucle/b097ab4663af/.gitlab-ci.yml'

variables:
  BOUCLE_FORGE_HOST: "framagit.org"

# GitLab Pages deployment — declarative mode (no BOUCLE_DEPLOY_CMD).
# Builds the Astro site and publishes to GitLab Pages.
pages:
  stage: deploy
  image: node:22
  script:
    - npm ci
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH